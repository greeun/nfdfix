[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfdfix"
version = "0.1.0"
description = "Normalizes filenames macOS stores in decomposed form (NFD) to NFC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nfdfix = "nfdfix.cli:run"

[project.optional-dependencies]
tui = ["textual>=6"]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "textual>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/nfdfix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
